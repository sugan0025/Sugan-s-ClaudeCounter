<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230">
  <defs>
    <linearGradient id="borderSim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.95"/>
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.5"/>
    </linearGradient>
    <filter id="glowSim">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="436" height="226" rx="16" ry="16" fill="none" stroke="url(#borderSim)" stroke-width="2" filter="url(#glowSim)"/>
  <rect x="4" y="4" width="432" height="222" rx="14" ry="14" fill="#0d1117" fill-opacity="0.92"/>
  <rect x="4" y="4" width="432" height="222" rx="14" ry="14" fill="#0c231a" fill-opacity="0.45"/>
  
  <!-- Header -->
  <rect x="22" y="22" width="4" height="38" rx="2" fill="#10b981"/>
  <text x="36" y="40" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">💻 Zero-Dep Web Simulator</text>
  <text x="36" y="58" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">PURE HTML5/ES6/CSS3  •  OFFLINE SANDBOX TESTING</text>
  
  <line x1="22" y1="72" x2="418" y2="72" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
  
  <!-- Description -->
  <text x="22" y="94" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#c9d1d9">Self-contained browser simulator (index.html) running without</text>
  <text x="22" y="112" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#c9d1d9">npm builds or dependencies to preview HUD telemetry and cat states.</text>
  
  <!-- Tech Stack Pills -->
  <rect x="22" y="132" width="84" height="22" rx="11" fill="#10b981" fill-opacity="0.18"/>
  <text x="32" y="147" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#6ee7b7">Vanilla ES6</text>
  <rect x="114" y="132" width="94" height="22" rx="11" fill="#06b6d4" fill-opacity="0.18"/>
  <text x="124" y="147" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#67e8f9">Index.html</text>
  <rect x="216" y="132" width="86" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.18"/>
  <text x="226" y="147" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#c4b5fd">Zero-Build</text>
  <rect x="310" y="132" width="98" height="22" rx="11" fill="#3b82f6" fill-opacity="0.18"/>
  <text x="320" y="147" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#93c5fd">Local Offline</text>

  <!-- Metric badges -->
  <text x="22" y="184" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#8b949e">⚡ <tspan fill="#ffffff" font-weight="600">Zero Node.js</tspan>  •  🔒 <tspan fill="#ffffff" font-weight="600">100% Private</tspan>  •  🎯 <tspan fill="#ffffff" font-weight="600">Cross-Platform</tspan></text>
  <text x="22" y="206" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#10b981">▶ Open index.html directly in any modern browser</text>
</svg>
