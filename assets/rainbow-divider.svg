      </stop>
      <stop offset="25%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#f59e0b;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#e28743">
        <animate attributeName="stop-color" values="#e28743;#10b981;#8b5cf6;#e28743" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#e28743;#38bdf8;#10b981" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
