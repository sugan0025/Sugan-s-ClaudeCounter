<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <linearGradient id="borderFlowClaude" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.95"/>
      <stop offset="35%" style="stop-color:#e28743;stop-opacity:0.85"/>
      <stop offset="70%" style="stop-color:#38bdf8;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="shadowFlowClaude">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#8b5cf6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Card Base -->
  <rect x="2" y="2" width="896" height="176" rx="16" ry="16" fill="none" stroke="url(#borderFlowClaude)" stroke-width="2" filter="url(#shadowFlowClaude)"/>
  <rect x="4" y="4" width="892" height="172" rx="14" ry="14" fill="#0d1117" fill-opacity="0.94"/>
  <rect x="4" y="4" width="892" height="172" rx="14" ry="14" fill="#17122b" fill-opacity="0.4"/>

  <!-- Section Title -->
  <text x="30" y="32" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#c4b5fd">🐱 END-TO-END AI TELEMETRY, TOKEN LIFECYCLE &amp; SESSION RECOVERY PIPELINE</text>
  <line x1="30" y1="42" x2="870" y2="42" stroke="#30363d" stroke-width="1"/>

  <!-- Step 1: Input Dock -->
  <g transform="translate(30, 56)">
    <rect x="0" y="0" width="145" height="100" rx="10" fill="#161b22" stroke="#8b5cf6" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#8b5cf6"/>
    <text x="20" y="24" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" fill="#0d1117" text-anchor="middle">1</text>
    <text x="75" y="44" font-size="22" text-anchor="middle">🐱</text>
    <text x="75" y="68" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Prompt Box Dock</text>
    <text x="75" y="84" font-family="'Segoe UI',Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">Observer • '+' Align</text>
  </g>

  <!-- Arrow 1 -->
  <text x="190" y="112" font-family="'Segoe UI',Roboto,sans-serif" font-size="16" fill="#8b5cf6" text-anchor="middle">➔</text>

  <!-- Step 2: Typing State Engine -->
  <g transform="translate(205, 56)">
    <rect x="0" y="0" width="145" height="100" rx="10" fill="#161b22" stroke="#e28743" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#e28743"/>
    <text x="20" y="24" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" fill="#0d1117" text-anchor="middle">2</text>
    <text x="75" y="44" font-size="22" text-anchor="middle">⌨️</text>
    <text x="75" y="68" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">State Machine</text>
    <text x="75" y="84" font-family="'Segoe UI',Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">Idle ↔ Fast Typing</text>
  </g>

  <!-- Arrow 2 -->
  <text x="365" y="112" font-family="'Segoe UI',Roboto,sans-serif" font-size="16" fill="#e28743" text-anchor="middle">➔</text>

  <!-- Step 3: Token Scraper & Cache -->
  <g transform="translate(380, 56)">
    <rect x="0" y="0" width="145" height="100" rx="10" fill="#161b22" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#38bdf8"/>
    <text x="20" y="24" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" fill="#0d1117" text-anchor="middle">3</text>
    <text x="75" y="44" font-size="22" text-anchor="middle">⏱️</text>
    <text x="75" y="68" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Token &amp; Cache TTL</text>
    <text x="75" y="84" font-family="'Segoe UI',Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">O200k • 5m Sliding</text>
  </g>

  <!-- Arrow 3 -->
  <text x="540" y="112" font-family="'Segoe UI',Roboto,sans-serif" font-size="16" fill="#38bdf8" text-anchor="middle">➔</text>

  <!-- Step 4: Liquid Glass HUD -->
  <g transform="translate(555, 56)">
    <rect x="0" y="0" width="145" height="100" rx="10" fill="#161b22" stroke="#a855f7" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#a855f7"/>
    <text x="20" y="24" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" fill="#0d1117" text-anchor="middle">4</text>
    <text x="75" y="44" font-size="22" text-anchor="middle">🧊</text>
    <text x="75" y="68" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Liquid Glass HUD</text>
    <text x="75" y="84" font-family="'Segoe UI',Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">36px Blur • 5h/7d Lim</text>
  </g>

  <!-- Arrow 4 -->
  <text x="715" y="112" font-family="'Segoe UI',Roboto,sans-serif" font-size="16" fill="#a855f7" text-anchor="middle">➔</text>

  <!-- Step 5: Resilient Exporter -->
  <g transform="translate(730, 56)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="#161b22" stroke="#10b981" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#10b981"/>
    <text x="20" y="24" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" fill="#0d1117" text-anchor="middle">5</text>
    <text x="70" y="44" font-size="22" text-anchor="middle">📥</text>
    <text x="70" y="68" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Session Exporter</text>
    <text x="70" y="84" font-family="'Segoe UI',Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">Markdown &amp; JSON</text>
  </g>
</svg>
