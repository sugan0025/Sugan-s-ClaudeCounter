<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230">
  <defs>
    <linearGradient id="borderCat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e28743;stop-opacity:0.95"/>
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.5"/>
    </linearGradient>
    <filter id="glowCat">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#e28743" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="436" height="226" rx="16" ry="16" fill="none" stroke="url(#borderCat)" stroke-width="2" filter="url(#glowCat)"/>
  <rect x="4" y="4" width="432" height="222" rx="14" ry="14" fill="#0d1117" fill-opacity="0.92"/>
  <rect x="4" y="4" width="432" height="222" rx="14" ry="14" fill="#24180d" fill-opacity="0.45"/>
  
  <!-- Header -->
  <rect x="22" y="22" width="4" height="38" rx="2" fill="#e28743"/>
  <text x="36" y="40" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">🐱 Dynamic Typing Cat</text>
  <text x="36" y="58" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#f59e0b">PROMPT BOX DOCK  •  ZERO DRIFT ALIGNMENT</text>
  
  <line x1="22" y1="72" x2="418" y2="72" stroke="#e28743" stroke-opacity="0.25" stroke-width="1"/>
  
  <!-- Description -->
  <text x="22" y="94" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#c9d1d9">Interactive mascot docked inside Claude's prompt box.</text>
  <text x="22" y="112" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#c9d1d9">Animates in sync with user input and Claude's streaming output.</text>
  
  <!-- Tech Stack Pills -->
  <rect x="22" y="132" width="96" height="22" rx="11" fill="#e28743" fill-opacity="0.18"/>
  <text x="32" y="147" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#fdba74">Input Observer</text>
  <rect x="126" y="132" width="90" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.18"/>
  <text x="136" y="147" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#c4b5fd">State Machine</text>
  <rect x="224" y="132" width="86" height="22" rx="11" fill="#38bdf8" fill-opacity="0.18"/>
  <text x="234" y="147" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#7dd3fc">CSS Sprites</text>
  <rect x="318" y="132" width="92" height="22" rx="11" fill="#10b981" fill-opacity="0.18"/>
  <text x="328" y="147" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#6ee7b7">Zero Jitter</text>

  <!-- Metric badges -->
  <text x="22" y="184" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#8b949e">😴 <tspan fill="#ffffff" font-weight="600">Calm Idle</tspan>  •  ⌨️ <tspan fill="#ffffff" font-weight="600">Fast Typing</tspan>  •  ⏳ <tspan fill="#ffffff" font-weight="600">2.5s</tspan> Decay Return</text>
  <text x="22" y="206" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#e28743">▶ Docked directly adjacent to Claude's '+' button</text>
</svg>
